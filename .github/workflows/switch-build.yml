name: Switch - First Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch-test:
    name: Build minimal Switch homebrew
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - name: Check Switch toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"
          test -n "$DEVKITPRO"
          test -n "$DEVKITA64"
          test -f "$DEVKITPRO/libnx/switch_rules"

      - name: Create minimal homebrew
        run: |
          mkdir -p /tmp/switch-test

          cat > /tmp/switch-test/main.c <<'EOF'
          #include <switch.h>
          #include <stdio.h>

          int main(int argc, char **argv) {
              consoleInit(NULL);

              printf("Mega Man X - Switch build test\n");
              printf("Hello from libnx!\n");

              consoleUpdate(NULL);

              while (appletMainLoop()) {
                  hidScanInput();

                  u64 keys = hidKeysDown(CONTROLLER_P1_AUTO);

                  if (keys & KEY_PLUS) {
                      break;
                  }

                  consoleUpdate(NULL);
              }

              consoleExit(NULL);
              return 0;
          }
          EOF

          cat > /tmp/switch-test/Makefile <<'EOF'
          include $(DEVKITPRO)/libnx/switch_rules

          TARGET := switch-test
          BUILD := build
          SOURCES := .
          DATA :=
          INCLUDES :=

          ARCH := -march=armv8-a+crc+crypto -mtune=cortex-a57
          CFLAGS := -g -Wall -O2 -ffunction-sections $(ARCH)
          CFLAGS += $(INCLUDE) -D__SWITCH__
          CXXFLAGS := $(CFLAGS) -fno-rtti -fno-exceptions
          ASFLAGS := -g $(ARCH)
          LDFLAGS := -specs=$(DEVKITPRO)/libnx/switch.specs -g $(ARCH) -Wl,-Map,$(notdir $*.map)

          LIBS := -lnx
          LIBDIRS := $(PORTLIBS) $(LIBNX)

          ifneq ($(BUILD),$(notdir $(CURDIR)))
          export OUTPUT := $(CURDIR)/$(TARGET)
          export TOPDIR := $(CURDIR)
          export VPATH := $(foreach dir,$(SOURCES),$(CURDIR)/$(dir))
          export DEPSDIR := $(CURDIR)/$(BUILD)

          CFILES := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.c)))
          OFILES := $(CFILES:.c=.o)
          export OFILES := $(OFILES)
          export INCLUDE := $(foreach dir,$(INCLUDES),-I$(CURDIR)/$(dir)) \
                            $(foreach dir,$(LIBDIRS),-I$(dir)/include)
          export LIBPATHS := $(foreach dir,$(LIBDIRS),-L$(dir)/lib)

          .PHONY: $(BUILD) clean all

          all: $(BUILD)

          $(BUILD):
          	@mkdir -p $@
          	@$(MAKE) --no-print-directory -C $(BUILD) -f $(CURDIR)/Makefile

          clean:
          	@rm -rf $(BUILD) $(TARGET).elf $(TARGET).nro

          else
          DEPENDS := $(OFILES:.o=.d)

          $(OUTPUT).nro: $(OUTPUT).elf
          $(OUTPUT).elf: $(OFILES)

          -include $(DEPENDS)
          endif
          EOF

          cd /tmp/switch-test
          make -j2

      - name: Upload NRO test artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-first-test
          path: /tmp/switch-test/switch-test.nro
          if-no-files-found: error
