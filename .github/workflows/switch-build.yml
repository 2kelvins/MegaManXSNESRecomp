name: Switch - First Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch-test:
    name: Build minimal Switch homebrew
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Check Switch toolchain
        run: |
          echo "Checking devkitPro..."
          test -x "$DEVKITA64/bin/aarch64-none-elf-gcc"
          test -f "$DEVKITPRO/libnx/switch.specs"
          test -f "$DEVKITPRO/libnx/include/switch.h"
          echo "Toolchain found!"

      - name: Create minimal homebrew
        run: |
          mkdir -p /tmp/switch-test
          cd /tmp/switch-test

          cat > main.c <<'EOF'
          #include <switch.h>
          #include <stdio.h>

          int main(int argc, char **argv)
          {
              consoleInit(NULL);

              printf("Mega Man X - Switch Test\n");
              printf("Hello from Nintendo Switch!\n");

              while (appletMainLoop())
              {
                  consoleUpdate(NULL);
              }

              consoleExit(NULL);
              return 0;
          }
          EOF

          echo "Compiling ARM64..."

          "$DEVKITA64/bin/aarch64-none-elf-gcc" \
            -march=armv8-a+crc+crypto \
            -mtune=cortex-a57 \
            -O2 \
            -Wall \
            -fPIE \
            -D__SWITCH__ \
            -I"$DEVKITPRO/libnx/include" \
            -specs="$DEVKITPRO/libnx/switch.specs" \
            main.c \
            -L"$DEVKITPRO/libnx/lib" \
            -lnx \
            -o switch-test.elf

          echo "Generating NRO..."

          "$DEVKITPRO/tools/bin/elf2nro" \
            switch-test.elf switch-test.nro

          test -f switch-test.nro
          ls -lh switch-test.nro

      - name: Upload Switch NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-first-test
          path: /tmp/switch-test/switch-test.nro
          if-no-files-found: error
