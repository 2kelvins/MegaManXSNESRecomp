name: Switch - First Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch-test:
    name: Build minimal Switch homebrew
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64

    steps:
      - name: Check Switch toolchain
        run: |
          echo "Checking devkitPro..."
          test -x "$DEVKITA64/bin/aarch64-none-elf-gcc"
          test -f "$DEVKITPRO/libnx/switch.specs"
          echo "Toolchain found!"

      - name: Download official Switch example
        run: |
          git clone --depth 1 \
            https://github.com/switchbrew/switch-examples.git \
            /tmp/switch-examples

          test -f /tmp/switch-examples/templates/application/Makefile

      - name: Create and build Switch homebrew
        run: |
          cd /tmp/switch-examples/templates/application

          cat > source/main.c <<'EOF'
          #include <switch.h>
          #include <stdio.h>

          int main(int argc, char **argv)
          {
              consoleInit(NULL);

              printf("Mega Man X - Switch Test\n");
              printf("Hello from Nintendo Switch!\n");

              while (appletMainLoop())
              {
                  consoleUpdate(NULL);
              }

              consoleExit(NULL);
              return 0;
          }
          EOF

          echo "Building with devkitPro Makefile..."
          make -j2

          mkdir -p /tmp/switch-test

          find . -maxdepth 1 -name '*.nro' \
            -exec cp {} /tmp/switch-test/switch-test.nro \;

          test -s /tmp/switch-test/switch-test.nro

          ls -lh /tmp/switch-test/switch-test.nro

            - name: Upload Switch NRO
              uses: actions/upload-artifact@v4
              with:
                name: switch-first-test
                path: /tmp/switch-test/switch-test.nro
                if-no-files-found: error
