name: Switch - Mega Man X Compile Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mmx-compile:
    name: Compile Mega Man X for ARM64
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: find fiber compatibility header
        run: |
          echo "searching for fiber_compat.h ..."
          find . -type f -name "fiber_compat.h"

      - name: Check pthread support
        run: |
          cat > /tmp/test_pthread.c <<'EOF'
          #include <pthread.h>

          static void *worker(void *arg) {
              return arg;
          }

          int main(void) {
              pthread_t thread;
              pthread_mutex_t mutex = PTHREAD_MUTEX_INITIALIZER;
              pthread_cond_t cond = PTHREAD_COND_INITIALIZER;

              pthread_mutex_lock(&mutex);
              pthread_cond_signal(&cond);
              pthread_mutex_unlock(&mutex);

              if (pthread_create(&thread, NULL, worker, NULL) != 0)
                  return 1;

              pthread_join(thread, NULL);
              pthread_cond_destroy(&cond);
              pthread_mutex_destroy(&mutex);
              return 0;
          }
          EOF

          $DEVKITA64/bin/aarch64-none-elf-gcc \
            /tmp/test_pthread.c \
            -o /tmp/test_pthread.elf \
            -pthread

          echo "Pthread compilation and linking succeeded!"

      - name: Compile Mega Man X fiber compatibility
        run: |
          echo "Compiling fiber compatibility for Switch ARM64..."

          mkdir -p build-switch

          $DEVKITA64/bin/aarch64-none-elf-gcc \
            -std=gnu11 \
            -D__ANDROID__ \
            -I snesrecomp/runner/src/desktop \
            -I snesrecomp/runner/src \
            -c snesrecomp/runner/src/desktop/fiber_compat.c \
            -o build-switch/fiber_compat.o \
            -pthread

          echo "Fiber compatibility compilation succeeded!"

      - name: Compile Mega Man X RTL for Switch
        run: |
          echo "Testing Mega Man X RTL compilation for Switch ARM64..."

          mkdir -p build-switch

          $DEVKITA64/bin/aarch64-none-elf-gcc \
            -std=gnu11 \
            -D__ANDROID__ \
            -I src \
            -I recomp \
            -I snesrecomp/runner/src \
            -I snesrecomp/runner/src/snes \
            -I snesrecomp/runner/src/desktop \
            -c src/mmx_rtl.c \
            -o build-switch/mmx_rtl.o \
            -pthread

          echo "Mega Man X RTL compilation succeeded!"

      - name: Check compiler
        run: |
          echo "Checking Nintendo Switch compiler"
          $DEVKITA64/bin/aarch64-none-elf-gcc --version

      - name: Check Mega Man X source files
        run: |
          test -f src/mmx_cpu_infra.c
          test -f src/mmx_rtl.h
          test -d snesrecomp/runner/src
          echo "Source files found!"

      - name: Compile Mega Man X CPU infrastructure
        run: |
          mkdir -p build-switch
          $DEVKITA64/bin/aarch64-none-elf-gcc \
            -std=gnu11 \
            -I src \
            -I snesrecomp/runner/src \
            -I snesrecomp/runner/src/snes \
            -c src/mmx_cpu_infra.c \
            -o build-switch/mmx_cpu_infra.o

      - name: Check compiled object
        run: |
          ls -lh build-switch/mmx_cpu_infra.o
          echo "Mega Man X ARM64 compilation succeeded!"

      - name: Inspect Switch link requirements
        run: |
          echo "=== Existing build definitions ==="
          find . -maxdepth 4 \( -name Makefile -o -name CMakeLists.txt \) -print | head -80

          echo "=== Potential entry points ==="
          grep -R -n -m 2 -E 'int main\\s*\\(' src snesrecomp/runner/src 2>/dev/null | head -50 || true

          echo "=== Compiled ARM64 objects ==="
          ls -lh build-switch/*.o

          echo "=== Available NRO tools ==="
          command -v elf2nro || true
          ls /opt/devkitpro/tools/bin/elf2nro 2>/dev/null || true

          echo "=== libnx ==="
          ls /opt/devkitpro/libnx/lib/libnx.a 2>/dev/null || true

      - name: Upload ARM64 compile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mmx-arm64-objects-test-10
          path: build-switch/*.o
          if-no-files-found: error
