name: Switch - Mega Man X Teste 44

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar-sete-modulos:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compilar base e sete candidatos
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-switch/test44
          mkdir -p "$OUT/base" "$OUT/novos" "$OUT/logs"
          CC="$DEVKITA64/bin/aarch64-none-elf-gcc"
          INCLUDES=(-I src -I "$DEVKITPRO/libnx/include")
          for d in src/gen recomp variants/jp/config snesrecomp/runner/src snesrecomp/runner/src/desktop snesrecomp/runner/include "$DEVKITPRO/portlibs/switch/include" "$DEVKITPRO/portlibs/switch/include/SDL2"; do
            if test -d "$d"; then INCLUDES+=("-I$d"); fi
          done
          base_sources=(
            src/mmx_cpu_infra.c
            src/mmx_rtl.c
            snesrecomp/runner/src/common_cpu_infra.c
            snesrecomp/runner/src/cpu_state.c
            snesrecomp/runner/src/common_rtl.c
            snesrecomp/runner/src/snes/snes.c
            snesrecomp/runner/src/snes/ppu.c
            snesrecomp/runner/src/snes/dma.c
            snesrecomp/runner/src/snes/cart.c
            snesrecomp/runner/src/cpu_trace.c
            snesrecomp/runner/src/snes/apu.c
            snesrecomp/runner/src/snes/cpu.c
            snesrecomp/runner/src/snes/joypad.c
            snesrecomp/runner/src/snes/dsp1.c
            snesrecomp/runner/src/snes/dsp1_hle.c
            snesrecomp/runner/src/snes/dsp.c
            snesrecomp/runner/src/snes/dsp_shadow.c
            snesrecomp/runner/src/snes/spc.c
            src/mmx_spc_player.c
            snesrecomp/runner/src/audio_trace.c
            snesrecomp/runner/src/snes/audio_shadow.c
            src/mmx_boss_rush_audio.c
            snesrecomp/runner/src/mod_audio.c
            src/mmx_boss_rush.c
            src/mmx_coop.c
            src/mmx_weapons.c
            src/mmx_knc_bugfix.c
            src/mmx_coop_view.c
            src/mmx_zero.c
            src/mmx_weapon_combat.c
            src/mmx_wide_policy.c
            snesrecomp/runner/src/snes/interp_bridge.c
            snesrecomp/runner/src/snes/sdd1.c
            src/mmx_replay.c
            src/mmx_renderer.c
            snesrecomp/runner/src/snes/tier2_capture.c
            src/mmx_render_assets.c
            snesrecomp/runner/src/diagnostics/replay_writer.c
            snesrecomp/runner/src/snes/interp816.c
          )
          new_sources=(
            snesrecomp/runner/src/snes/cx4.c
            snesrecomp/runner/src/snes/sa1.c
            snesrecomp/runner/src/snes/superfx.c
            snesrecomp/runner/src/snes/snes_other.c
            snesrecomp/runner/src/diagnostics/trace_writer.c
            src/mmx_boss_rush_draw.c
            snesrecomp/runner/src/setup_host_dispatch.c
          )
          : > "$OUT/compilacao.csv"
          base_objects=()
          i=0
          for src in "${base_sources[@]}"; do
            i=$((i+1))
            obj="$OUT/base/$(printf '%02d' "$i")_$(basename "$src" .c).o"
            if "$CC" -std=gnu11 -O0 -Wall -fPIE "${INCLUDES[@]}" -c "$src" -o "$obj" > "$OUT/logs/base_$(printf '%02d' "$i").log" 2>&1; then
              echo "BASE,OK,$src" >> "$OUT/compilacao.csv"
              base_objects+=("$obj")
            else
              echo "BASE,FALHOU,$src" >> "$OUT/compilacao.csv"
              exit 1
            fi
          done
          "$CC" -r "${base_objects[@]}" -o "$OUT/base-combinado.o" > "$OUT/link-base.log" 2>&1
          new_objects=()
          i=0
          for src in "${new_sources[@]}"; do
            i=$((i+1))
            obj="$OUT/novos/$(printf '%02d' "$i")_$(basename "$src" .c).o"
            if [[ ! -f "$src" ]]; then
              echo "NOVO,AUSENTE,$src" >> "$OUT/compilacao.csv"
              continue
            fi
            if "$CC" -std=gnu11 -O0 -Wall -fPIE "${INCLUDES[@]}" -c "$src" -o "$obj" > "$OUT/logs/novo_$(printf '%02d' "$i").log" 2>&1; then
              echo "NOVO,OK,$src" >> "$OUT/compilacao.csv"
              new_objects+=("$obj")
            else
              echo "NOVO,FALHOU,$src" >> "$OUT/compilacao.csv"
            fi
          done
          if (( ${#new_objects[@]} > 0 )); then
            if "$CC" -r "${base_objects[@]}" "${new_objects[@]}" -o "$OUT/ampliado-combinado.o" > "$OUT/link-ampliado.log" 2>&1; then
              echo "OK" > "$OUT/link-ampliado-status.txt"
            else
              echo "FALHOU" > "$OUT/link-ampliado-status.txt"
            fi
          else
            echo "SEM_MODULOS" > "$OUT/link-ampliado-status.txt"
          fi

      - name: Comparar simbolos
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path('build-switch/test44')
          root.mkdir(parents=True,exist_ok=True)
          nm='/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm'
          def symbols(path):
              if not path.exists(): return None
              p=subprocess.run([nm,'-g',str(path)],capture_output=True,text=True,errors='replace')
              if p.returncode: return None
              defined=set(); undefined=set()
              for line in p.stdout.splitlines():
                  m=re.match(r'^\s*(?:[0-9a-fA-F]+\s+)?([A-Za-z])\s+(\S+)$',line)
                  if not m: continue
                  typ,sym=m.groups()
                  if typ.upper()=='U': undefined.add(sym)
                  elif typ.upper()!='N': defined.add(sym)
              return undefined-defined
          before=symbols(root/'base-combinado.o')
          after=symbols(root/'ampliado-combinado.o')
          lines=['TESTE 44 - 39 MODULOS + 7 CANDIDATOS']
          lines+=['Link ampliado: '+((root/'link-ampliado-status.txt').read_text().strip() if (root/'link-ampliado-status.txt').exists() else 'NAO_EXECUTADO')]
          if before is not None: lines+=['Indefinidos na base: '+str(len(before))]
          if after is not None: lines+=['Indefinidos ampliado: '+str(len(after))]
          if before is not None and after is not None:
              resolved=sorted(before-after)
              introduced=sorted(after-before)
              lines+=['Resolvidos: '+str(len(resolved)),'Novos indefinidos: '+str(len(introduced)),'Saldo: '+str(len(resolved)-len(introduced))]
              for name,items in [('resolvidos.txt',resolved),('novos-indefinidos.txt',introduced),('restantes.txt',sorted(after))]:
                  (root/name).write_text('\n'.join(items)+'\n' if items else '')
          else:
              lines+=['Comparacao indisponivel; verificar compilacao.csv e link-ampliado.log']
          (root/'resumo.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Enviar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MegaManX-Switch-Teste44-Relatorios
          path: build-switch/test44/
          if-no-files-found: warn
