
name: Switch - Mega Man X Teste 11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nro:
    name: Gerar NRO de diagnostico
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Verificar ferramentas e codigo
        run: |
          set -eu
          test -f src/switch_main.c
          test -f "$DEVKITPRO/libnx/include/switch.h"
          test -f "$DEVKITPRO/libnx/lib/libnx.a"
          test -f "$DEVKITPRO/libnx/switch.specs"
          test -f "$DEVKITPRO/libnx/switch.ld"
          test -x "$DEVKITPRO/tools/bin/elf2nro"
          echo "Ferramentas encontradas!"

      - name: Teste 15 - Verificar suporte a ucontext
        run: |
          echo "Verificando ucontext.h no devkitPro..."

          printf '#include <ucontext.h>\nint main(void) { return 0; }\n' > /tmp/test_ucontext.c

          if "$DEVKITA64/bin/aarch64-none-elf-gcc" \
            -c /tmp/test_ucontext.c \
            -o /tmp/test_ucontext.o; then
            echo "RESULTADO: ucontext.h disponivel!"
          else
            echo "RESULTADO: ucontext.h indisponivel."
            echo "Precisaremos de outra implementacao de fibers."
          fi

       - name: Teste 16 - Verificar suporte a pthread
         run: |
          echo "Verificando pthread.h no devkitPro..."

          printf '#include <pthread.h>\nint main(void) { pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER; return pthread_mutex_destroy(&m); }\n' > /tmp/test_pthread.c

          if "$DEVKITA64/bin/aarch64-none-elf-gcc" \
            -std=gnu11 \
            -c /tmp/test_pthread.c \
            -o /tmp/test_pthread.o; then
            echo "RESULTADO: pthread.h disponivel!"
          else
            echo "RESULTADO: pthread.h indisponivel."
          fi
          
      - name: Compilar programa para Switch
        run: |
          set -eu
          mkdir -p build-switch

          "$DEVKITA64/bin/aarch64-none-elf-gcc" \
            -std=gnu11 \
            -O2 \
            -Wall \
            -fPIE \
            -I"$DEVKITPRO/libnx/include" \
            -specs="$DEVKITPRO/libnx/switch.specs" \
            -o build-switch/mmx-test11.elf \
            src/switch_main.c \
            -L"$DEVKITPRO/libnx/lib" \
            -lnx

      - name: Converter ELF para NRO
        run: |
          set -eu
          "$DEVKITPRO/tools/bin/elf2nro" \
            build-switch/mmx-test11.elf \
            build-switch/mmx-test11.nro

          ls -lh build-switch/mmx-test11.nro

      - name: Disponibilizar NRO
        uses: actions/upload-artifact@v4
        with:
          name: MegaManX-Switch-Teste11
          path: build-switch/mmx-test11.nro
          if-no-files-found: error
